[project]
name = "fenceline"
version = "1.2.0"
description = "Zero-day security scanner for Python codebases"
readme = "README.md"
license = "MIT"
requires-python = ">=3.13"
authors = [
    {name = "Luis Valverde"},
]
maintainers = [
    {name = "Luis Valverde", email = "lvalverdeb@gmail.com"},
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3 :: Only",
    "Operating System :: OS Independent",
    "Topic :: Security",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/lvalverdeb/fenceline"
Repository = "https://github.com/lvalverdeb/fenceline"
Documentation = "https://github.com/lvalverdeb/fenceline#readme"
Issues = "https://github.com/lvalverdeb/fenceline/issues"

[project.scripts]
fenceline = "fenceline.cli:main"

[build-system]
requires = ["setuptools>=80", "wheel"]
build-backend = "setuptools.build_meta"

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "ruff>=0.11.0",
]

[tool.setuptools]
include-package-data = true

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.packages.find]
where = ["src"]
include = ["fenceline*"]

[tool.setuptools.package-data]
fenceline = ["py.typed", "vuln_deps.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP"]
ignore = ["E501"]
